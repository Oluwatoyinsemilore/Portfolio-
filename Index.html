<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oluwatoyin Olorukooba — Visual &amp; UI/UX Designer</title>
<meta name="description" content="Oluwatoyin Olorukooba is a visual and UI/UX designer based in Ilorin, Nigeria, working across graphic design, campaign visuals, editorial design and digital products.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>

/* ============ TOKENS ============ */
:root{
  --cream:#F6F1E6;
  --cream-2:#ECE1CD;
  --paper:#FBF8F1;
  --wine:#6E1B3B;
  --wine-deep:#48122A;
  --wine-soft:#F1DCE2;
  --ink:#221A17;
  --ink-soft:rgba(34,26,23,0.64);
  --ink-faint:rgba(34,26,23,0.42);
  --line:rgba(34,26,23,0.14);
  --line-strong:rgba(34,26,23,0.24);
  --display:'Fraunces', serif;
  --body:'Inter', sans-serif;
  --mono:'IBM Plex Mono', monospace;
  --max:1240px;
}

/* ============ RESET ============ */
*,*::before,*::after{ box-sizing:border-box; }
*{ margin:0; padding:0; }
html{ scroll-behavior:smooth; }
@media (prefers-reduced-motion: reduce){ html{ scroll-behavior:auto; } }
body{
  background:var(--cream);
  color:var(--ink);
  font-family:var(--body);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
img{ max-width:100%; display:block; }
a{ color:inherit; text-decoration:none; }
ul{ list-style:none; }
button{ font:inherit; background:none; border:none; cursor:pointer; color:inherit; }

.wrap{ max-width:var(--max); margin:0 auto; padding:0 56px; }
@media (max-width:900px){ .wrap{ padding:0 32px; } }
@media (max-width:560px){ .wrap{ padding:0 22px; } }

section{ position:relative; padding:128px 0; }
@media (max-width:900px){ section{ padding:88px 0; } }
@media (max-width:560px){ section{ padding:68px 0; } }

.eyebrow{
  font-family:var(--mono);
  font-size:11.5px;
  letter-spacing:0.16em;
  text-transform:uppercase;
  color:var(--wine);
  display:flex;
  align-items:center;
  gap:12px;
}
.eyebrow::before{ content:""; width:26px; height:1px; background:var(--wine); }
.eyebrow .folio{ color:var(--ink-faint); }

h1,h2,h3,h4{ font-family:var(--display); font-weight:600; letter-spacing:-0.01em; color:var(--ink); }

.section-head{ max-width:660px; margin-bottom:64px; }
.section-head .eyebrow{ margin-bottom:20px; }
.section-head h2{ font-size:clamp(30px,4vw,46px); line-height:1.08; }
.section-head p{ margin-top:18px; font-size:16.5px; line-height:1.7; color:var(--ink-soft); max-width:560px; }

.btn{
  font-family:var(--mono);
  font-size:12.5px;
  letter-spacing:0.06em;
  text-transform:uppercase;
  display:inline-flex;
  align-items:center;
  gap:10px;
  padding:16px 30px;
  border-radius:100px;
  transition:transform 0.25s ease, background 0.25s ease, color 0.25s ease, border-color .25s ease;
}
.btn-solid{ background:var(--wine); color:var(--cream); }
.btn-solid:hover{ background:var(--wine-deep); transform:translateY(-2px); }
.btn-outline{ border:1px solid var(--line-strong); color:var(--ink); }
.btn-outline:hover{ border-color:var(--wine); color:var(--wine); transform:translateY(-2px); }
.btn-arrow{ transition:transform .25s ease; }
.btn:hover .btn-arrow{ transform:translateX(4px); }

/* ============ NAV ============ */
.nav{
  position:sticky; top:0; z-index:100;
  background:rgba(246,241,230,0.86);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid transparent;
  transition:border-color .3s ease, box-shadow .3s ease;
}
.nav.scrolled{ border-color:var(--line); box-shadow:0 1px 0 rgba(34,26,23,0.02); }
.nav-inner{
  display:flex; align-items:center; justify-content:space-between;
  padding:22px 0;
}
.nav-mark{
  font-family:var(--display); font-weight:600; font-size:18px;
  display:flex; align-items:center; gap:10px;
}
.nav-mark .dot{ width:8px; height:8px; border-radius:50%; background:var(--wine); }
.nav-links{ display:flex; align-items:center; gap:36px; }
.nav-links a{
  font-family:var(--mono); font-size:12.5px; letter-spacing:0.05em; text-transform:uppercase;
  color:var(--ink-soft); position:relative; padding-bottom:4px;
}
.nav-links a::after{
  content:""; position:absolute; left:0; right:100%; bottom:0; height:1px; background:var(--wine);
  transition:right .25s ease;
}
.nav-links a:hover{ color:var(--ink); }
.nav-links a:hover::after{ right:0; }
.nav-cta{
  font-family:var(--mono); font-size:12px; letter-spacing:0.05em; text-transform:uppercase;
  padding:11px 22px; border:1px solid var(--line-strong); border-radius:100px;
  color:var(--ink); transition:all .25s ease;
}
.nav-cta:hover{ background:var(--wine); border-color:var(--wine); color:var(--cream); }

.nav-toggle{ display:none; flex-direction:column; gap:5px; width:26px; }
.nav-toggle span{ height:1.5px; width:100%; background:var(--ink); transition:transform .25s ease, opacity .25s ease; }
.nav-toggle.open span:nth-child(1){ transform:translateY(6.5px) rotate(45deg); }
.nav-toggle.open span:nth-child(2){ opacity:0; }
.nav-toggle.open span:nth-child(3){ transform:translateY(-6.5px) rotate(-45deg); }

@media (max-width:860px){
  .nav-links{
    position:fixed; inset:0 0 0 auto; top:66px; height:0; overflow:hidden;
    background:var(--cream); flex-direction:column; align-items:flex-start; gap:0;
    width:100%; transition:height .3s ease; border-top:1px solid var(--line);
  }
  .nav-links.open{ height:calc(100vh - 66px); }
  .nav-links a{ width:100%; padding:20px 32px; border-bottom:1px solid var(--line); font-size:14px; }
  .nav-links a::after{ display:none; }
  .nav-cta{ display:none; }
  .nav-toggle{ display:flex; }
}

/* ============ HERO ============ */
.hero{ padding:64px 0 0; overflow:hidden; }
.hero-top-row{
  display:flex; justify-content:space-between; align-items:flex-start; gap:24px;
  padding-bottom:56px; border-bottom:1px solid var(--line);
}
.hero-loc{
  font-family:var(--mono); font-size:12px; letter-spacing:0.08em; text-transform:uppercase; color:var(--ink-faint);
  max-width:200px; line-height:1.6;
}
.hero-loc b{ color:var(--ink); font-weight:500; }
.hero-main{
  display:grid; grid-template-columns:1fr 340px; gap:60px; align-items:end;
  padding:56px 0 0;
}
@media (max-width:900px){ .hero-main{ grid-template-columns:1fr; } }

h1.hero-title{
  font-size:clamp(46px,7.4vw,104px);
  line-height:0.94;
  letter-spacing:-0.02em;
  font-weight:500;
}
h1.hero-title .accent{ color:var(--wine); font-style:italic; font-weight:400; }

.hero-photo-wrap{
  position:relative;
  justify-self:end;
}
.hero-photo{
  width:280px; height:340px; object-fit:cover;
  border-radius:6px 6px 60px 6px;
  box-shadow:0 30px 60px -25px rgba(34,26,23,0.35);
}
.hero-photo-tag{
  position:absolute; bottom:-18px; left:-18px;
  background:var(--wine); color:var(--cream);
  font-family:var(--mono); font-size:11px; letter-spacing:0.05em; text-transform:uppercase;
  padding:12px 16px; border-radius:8px;
  box-shadow:0 12px 24px -10px rgba(110,27,59,0.5);
}
@media (max-width:900px){
  .hero-photo-wrap{ justify-self:start; order:-1; margin-bottom:8px; }
  .hero-photo{ width:180px; height:220px; }
}

.hero-sub-row{
  display:grid; grid-template-columns:1fr 340px; gap:60px; align-items:start;
  padding-top:32px;
